name: Address identity browser gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck:browser
      - run: npm run test:browser
